version = 1
name = "Ash development"

[setup]
script = "node scripts/dev/setup.mjs"

[[actions]]
name = "Run Preview"
icon = "run"
command = "pnpm --silent dev"

[[actions]]
name = "Run Ephemeral Preview"
icon = "run"
command = "pnpm --silent dev:verify --live-calls 20 --live-minutes 10"

[[actions]]
name = "Stop Preview"
icon = "tool"
command = "pnpm --silent dev:stop"

[[actions]]
name = "Reset Preview"
icon = "tool"
command = "pnpm --silent dev:reset"

[[actions]]
name = "Quick Checks"
icon = "test"
command = "pnpm --silent verify --profile quick"

[[actions]]
name = "Run Tests"
icon = "test"
command = "pnpm --silent verify"

[[actions]]
name = "Status"
icon = "debug"
command = "pnpm --silent dev:status"
